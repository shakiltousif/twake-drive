version: "3.8"

services:
  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_DB=tdrive
      - POSTGRES_USER=tdrive
      - POSTGRES_PASSWORD=secret
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  node_create_user:
    build: &backend_docker_build
      context: .
      dockerfile: docker/tdrive-node/Dockerfile
      target: production
    restart: on-failure
    depends_on:
      - postgres # Ensure PostgreSQL starts first
    environment: &backend_env_vars
      - DEV=production
      - ACCOUNTS_TYPE=internal
      - DB_DRIVER=postgres
      - DB_POSTGRES_HOST=localhost
      - DB_POSTGRES_DBNAME=tdrive
      - DB_POSTGRES_USERNAME=tdrive
      - DB_POSTGRES_PASSWORD=secret
      - DB_POSTGRES_PORT=5432
      - DB_POSTGRES_USE_SSL=false
      - PUBSUB_TYPE=local
      - SEARCH_DRIVER=postgres
      - STORAGE_DRIVER=local
      - STORAGE_LOCAL_PATH=/tmp/tdrive
      - ENABLE_FEATURE_ANTIVIRUS=false
      - DIAG_PROBE_SECRET=diag-secret
    command: sh -c "sleep 10 && /usr/src/app/bin/twake-cli dev set_local_user a@b.com aaaaaaaa"
    volumes: &backend_volumes
      - ./backend/node/profiles:/usr/src/app/profiles
      - ./backend/node/src:/usr/src/app/src

  node:
    build: *backend_docker_build
    restart: always
    depends_on:
      - postgres
      - node_create_user
    ports:
      - 4000:4000
      - 9229:9229
    environment: *backend_env_vars
    command: sh -c "sleep 10 && node /usr/src/app/dist/tdrive.js"
    volumes: *backend_volumes

  frontend:
    build:
      context: .
      dockerfile: docker/tdrive-frontend/Dockerfile
    container_name: tdrive-frontend
    restart: always
    depends_on:
      - node
    environment:
      - DEV=production
      - SSL_CERTS=off
      - NODE_HOST=http://node:4000
    ports:
      - "8080:80"
    volumes:
      - ./docker-data/logs/nginx/:/var/log/nginx
      - ./docker-data/letsencrypt/:/etc/letsencrypt/
      - ./docker-data/drive-preview/:/tdrive-core/web/medias/
      - ./docker-data/uploads/:/tdrive-core/web/upload/
      - ./docker-data/ssl:/etc/nginx/ssl
